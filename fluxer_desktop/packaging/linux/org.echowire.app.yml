# SPDX-License-Identifier: AGPL-3.0-or-later
# Echowire: manifest for our own app id, replacing the upstream app.fluxer.Fluxer pair that was
# left pointing at desktop, metainfo and icon files this tree renamed to org.echowire.*.
#
# This one packages a local electron-builder output: put the unpacked linux-unpacked directory at
# ./app next to this file and run build-flatpak.sh with FLATPAK_APP_ID=org.echowire.app. It is
# therefore NOT the manifest a Flathub submission uses, because Flathub builds from sources it can
# fetch and verify itself. See ../flathub/README.md for that one.
id: org.echowire.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
branch: stable
command: org.echowire.app
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Camera access for video calls. The portal covers screen sharing through pipewire below, but
  # chromium still opens camera devices directly.
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  strip: false
  no-debuginfo: true
cleanup-commands:
  - rm -f /app/echowire/chrome-sandbox
modules:
  - name: echowire
    buildsystem: simple
    build-commands:
      - install -Dm755 org.echowire.app.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - mkdir -p ${FLATPAK_DEST}/echowire
      - cp -a app/. ${FLATPAK_DEST}/echowire/
      - patch-electron-desktop-filename ${FLATPAK_DEST}/echowire/resources/app.asar
      - install -Dm644 org.echowire.app.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 org.echowire.app.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 org.echowire.app.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
    sources:
      - type: file
        path: org.echowire.app.sh
      - type: file
        path: org.echowire.app.desktop
      - type: file
        path: org.echowire.app.metainfo.xml
      - type: file
        path: org.echowire.app.svg
