# Development services for this project only. Never a shared stack.
#
# The explicit name is the point: an unnamed stack inherits its directory name,
# which is how one machine ended up with 68 volumes it could not attribute.
name: <project>

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

# Build and dependency caches are bind mounts under ./.data, never named
# volumes, so `docker volume prune` stays safe to run - see C3.4.
