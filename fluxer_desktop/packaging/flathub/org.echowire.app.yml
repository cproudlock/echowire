# SPDX-License-Identifier: AGPL-3.0-or-later
# Echowire: the manifest for a Flathub submission of org.echowire.app.
#
# It installs the published linux x64 tarball rather than compiling the app, which is the pattern
# Flathub accepts for electron apps whose dependency tree cannot be vendored for an offline build
# (see ../flathub/README.md for why a source build is not on the table here and what a reviewer may
# ask for instead). The archive is pinned by sha256 and carries x-checker-data so
# flatpak-external-data-checker can open the version bump pull requests by itself.
#
# Regenerate the version, url and sha256 below with build-flathub-submission.sh. Do not edit them
# by hand: every one of the three has to come from the same release descriptor.
id: org.echowire.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: org.echowire.app
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Camera access for video calls. Screen sharing goes through the pipewire portal below, but
  # chromium opens camera devices directly and has no portal path for them.
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-run/pipewire-0:ro
  - --filesystem=xdg-run/speech-dispatcher:ro
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.ayatana.indicator.application
  - --talk-name=com.canonical.indicator.application
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons
build-options:
  strip: false
  no-debuginfo: true
cleanup-commands:
  - rm -f /app/echowire/chrome-sandbox
modules:
  - name: echowire
    buildsystem: simple
    build-commands:
      - install -Dm755 org.echowire.app.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - mkdir -p ${FLATPAK_DEST}/echowire
      - cp -a app/. ${FLATPAK_DEST}/echowire/
      - patch-electron-desktop-filename ${FLATPAK_DEST}/echowire/resources/app.asar
      - install -Dm644 org.echowire.app.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 org.echowire.app.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 org.echowire.app.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - |
        for size in 16 24 32 48 64 128 256 512; do
          install -Dm644 "icons/${size}x${size}.png" \
            "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"
        done
    sources:
      - type: archive
        archive-type: tar-gzip
        strip-components: 1
        dest: app
        url: https://echowire.org/api/dl/desktop/stable/linux/x64/2026.825.12857/tar_gz
        sha256: 4f21cdbcdabea13035266f157b39d2e485fe91c83a1d1355962916d647b06895
        x-checker-data:
          type: json
          url: https://echowire.org/api/dl/desktop/stable/linux/x64/latest
          version-query: .version
          url-query: .files.tar_gz.url
          sha256-query: .files.tar_gz.sha256
      - type: file
        path: org.echowire.app.sh
      - type: file
        path: org.echowire.app.desktop
      - type: file
        path: org.echowire.app.metainfo.xml
      - type: file
        path: org.echowire.app.svg
      - type: dir
        path: icons
        dest: icons
